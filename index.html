<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dillo ki Dhadkan 855</title>
<style>
 body{margin:0;background:#111;color:white;text-align:center;font-family:sans-serif}
 #gameArea{position:relative;width:100%;height:50vh;background:linear-gradient(#87CEEB,#d2b48c);border-bottom:6px solid #5a3e1b;overflow:hidden}
 .tractor{position:absolute;bottom:15px;width:120px;font-size:55px}
 #t1{left:20%} #t2{left:60%}
 #rope{position:absolute;bottom:55px;height:5px;background:#8B4513}
 button{padding:18px 35px;font-size:22px;background:#e60000;color:white;border:none;border-radius:12px;margin:8px;font-weight:bold}
 h1{color:#ffcc00;text-shadow:2px 2px 0 red}
</style>
</head>
<body>
<h1>🚜 Dillo Ki Dhadkan 855</h1>
<p id="status">KHEECH button ko tez dabao!</p>
<div id="gameArea">
 <div id="t1" class="tractor">🚜</div>
 <div id="t2" class="tractor">🚜</div>
 <div id="rope"></div>
</div>
<button id="kheech">KHEECH 💨</button>
<script>
let a=20,b=60,over=false;
let t1=document.getElementById('t1'),t2=document.getElementById('t2'),rope=document.getElementById('rope'),st=document.getElementById('status');
function upd(){t1.style.left=a+'%';t2.style.left=b+'%';rope.style.left=Math.min(a,b)+8+'%';rope.style.width=Math.abs(b-a)+'%';if(a<=0){st.innerText='🏆 SWARAJ 855 JEET GAYA! OPEN LION!';over=true;}}
document.getElementById('kheech').ontouchstart=(e)=>{e.preventDefault();if(over)return;a-=1.5;b-=0.7;upd();setTimeout(()=>{a+=0.7;b+=0.7;upd()},100)};
setInterval(()=>{if(!over){a+=0.2;b+=0.2;upd()}},200);upd();
</script>
</body>
</html>
